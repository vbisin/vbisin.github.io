name: Fetch Goodreads Data
on:
  schedule:
    - cron: '30 */12 * * *'  # Run every 12 hours (offset from the Letterboxd fetch)
  workflow_dispatch:  # Allow manual triggers

jobs:
  fetch-goodreads:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicit permission to write to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install axios xml2js

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch and process Goodreads data
        run: node .github/scripts/fetch-goodreads.js

      - name: Debug info
        run: |
          ls -la data/
          cat data/goodreads.json || echo "File is empty or doesn't exist"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/goodreads.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Goodreads data"

          # main can move between checkout and push (another workflow or a
          # manual push landing at the same time) - rebase onto the latest
          # main and retry a few times instead of failing on the first race.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "Failed to push after retries"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
