name: Fetch Goodreads Data
on:
  schedule:
    - cron: '30 */12 * * *'  # Run every 12 hours (offset from the Letterboxd fetch)
  workflow_dispatch:  # Allow manual triggers

# Never let two runs of this workflow race each other for the push. Queue
# instead of canceling so a manual dispatch doesn't get dropped.
concurrency:
  group: fetch-goodreads
  cancel-in-progress: false

jobs:
  fetch-goodreads:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicit permission to write to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios xml2js

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch and process Goodreads data
        run: node .github/scripts/fetch-goodreads.js

      - name: Debug info
        run: |
          ls -la data/
          cat data/goodreads.json || echo "File is empty or doesn't exist"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/goodreads.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Goodreads data"

          # main can still move between checkout and push (e.g. a manual
          # commit landing at the same time as this run). data/goodreads.json
          # is fully regenerated every run and has no meaningful history to
          # preserve, so on conflict always keep our freshly-fetched version
          # rather than trying to reconcile the two. Merge (not rebase) so a
          # conflict leaves a clean, abortable state instead of a stuck
          # rebase that every retry re-fails on.
          for i in 1 2 3 4 5; do
            git fetch origin main

            if git merge -X ours --no-edit origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git merge --abort
            fi

            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "Failed to push after retries"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
